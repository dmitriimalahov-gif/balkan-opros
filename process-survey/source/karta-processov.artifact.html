<title>Карта процессов Balkan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&family=PT+Serif:wght@700&display=swap">
<style>
/* Layout: one working column (max 1040px) under a sticky band with brand, language and the five-phase rail */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunken:#E8EDF5; --ink:#16212A; --muted:#5B6770; --line:#D6DDE8;
  --accent:#21439B; --accent-ink:#FFFFFF; --accent-soft:#E3EAF8;
  --amber:#93560A; --amber-soft:#F5E6CF; --danger:#A8352A; --danger-soft:#F6DDD8; --ok:#2E7550; --ok-soft:#DCEFE3;
  --shadow:0 1px 2px rgba(22,33,42,.06),0 8px 24px rgba(22,33,42,.06);
  --f-display:"PT Serif",Georgia,"Times New Roman",serif;
  --f-body:"Golos Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101619; --surface:#172024; --sunken:#1D282D; --ink:#E4EBE8; --muted:#97A5A2; --line:#2A363B;
  --accent:#7EA4F0; --accent-ink:#101A33; --accent-soft:#1D2B4A;
  --amber:#E4AA5C; --amber-soft:#3A2C17; --danger:#F08B7E; --danger-soft:#3D2420; --ok:#7FD0A0; --ok-soft:#1C3527;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101619; --surface:#172024; --sunken:#1D282D; --ink:#E4EBE8; --muted:#97A5A2; --line:#2A363B;
  --accent:#7EA4F0; --accent-ink:#101A33; --accent-soft:#1D2B4A;
  --amber:#E4AA5C; --amber-soft:#3A2C17; --danger:#F08B7E; --danger-soft:#3D2420; --ok:#7FD0A0; --ok-soft:#1C3527;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 17px/1 var(--f-display);flex:none}
.brand-logo{display:block;width:112px;height:auto;max-height:64px;object-fit:contain;background:#fff;border-radius:6px;padding:2px 4px;flex:none}
.brand-t{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand-t b{font:700 15px/1.2 var(--f-display);letter-spacing:.01em}
.brand-t span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 11px;font-size:13px;font-weight:600;letter-spacing:.04em;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink)}
.rail{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding-block:0 10px}
.rail-step{display:flex;flex-direction:column;gap:5px;min-width:0}
.rail-bar{height:4px;border-radius:2px;background:var(--sunken)}
.rail-step.done .rail-bar{background:var(--accent)}
.rail-step.cur .rail-bar{background:linear-gradient(90deg,var(--accent) 50%,var(--accent-soft) 50%)}
.rail-l{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-step.cur .rail-l{color:var(--ink);font-weight:600}
.rail-l b{font-family:var(--f-mono);font-weight:500;margin-right:4px}

/* Buttons, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--sunken)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;min-width:0}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:3px;width:17px;height:17px;accent-color:var(--accent);flex:none}
.role-picker{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.role-picker>summary{min-height:44px;display:flex;align-items:center;padding:9px 12px;cursor:pointer;color:var(--accent);font-weight:600;list-style-position:inside}
.role-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;max-height:320px;overflow-y:auto;border-top:1px solid var(--line);padding:8px 12px;overscroll-behavior:contain}
.role-option{min-height:44px;align-items:center;padding:3px 2px}
.role-option input{margin-top:0}
@media (max-width:640px){.role-options{grid-template-columns:1fr}.brand-logo{width:96px;height:auto;max-height:64px}}

/* Generic */
.main{padding-block:28px 64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.notice{border-radius:10px;padding:11px 14px;font-size:14px;background:var(--amber-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}
.notice.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.notice.err{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.prog{background:var(--amber-soft);color:var(--amber)}
.chip.rev{background:var(--accent-soft);color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}

/* Welcome */
.welcome{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.9fr);gap:28px;align-items:start}
.welcome h1{font:700 clamp(26px,4vw,36px)/1.15 var(--f-display);letter-spacing:-.005em;margin:6px 0 14px}
.welcome .intro{display:flex;flex-direction:column;gap:12px;max-width:62ch}
.welcome .intro p{color:var(--ink)}
.facts{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding:0;list-style:none}
.facts li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px;color:var(--muted)}
.facts li::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent);margin-top:7px;justify-self:center}
.form{padding:22px;display:flex;flex-direction:column;gap:16px;margin-top:22px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.steps{padding:22px}
.steps h2{font:700 18px/1.3 var(--f-display);margin-bottom:14px}
.steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0;padding-top:2px}
.steps .n{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font:500 13px/1 var(--f-mono)}
.steps b{display:block;font-weight:600;font-size:14.5px}
.steps span{font-size:13.5px;color:var(--muted)}

/* Chat */
.chat{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.log{display:flex;flex-direction:column;gap:14px;min-height:40vh}
.msg{display:flex;flex-direction:column;gap:4px;max-width:88%;min-width:0}
.msg .who{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.msg-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.msg-voice,.voice-toggle{min-width:44px;min-height:44px;padding:5px 9px;border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:17px;line-height:1;border-radius:7px;display:inline-flex;align-items:center;justify-content:center}
.msg-voice:hover,.voice-toggle:hover{background:var(--accent-soft)}
.msg-voice[aria-pressed="true"],.voice-toggle[aria-pressed="true"]{background:var(--accent-soft)}
.msg-voice svg,.voice-toggle svg,.mic-btn svg{width:20px;height:20px;flex:none;pointer-events:none}
.mic-btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.mic-btn.recording{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.mic-status{color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.mic-hint{font-size:12px;line-height:1.45;color:var(--muted);max-width:70ch}
.msg .txt{padding:11px 15px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.a{align-self:flex-start}
.msg.a .txt{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.msg.u{align-self:flex-end;align-items:flex-end}
.msg.u .txt{background:var(--accent-soft);border-top-right-radius:4px}
.msg.a.pending .txt{color:var(--muted)}
.dots::after{content:"…";display:inline-block;animation:blink 1.2s steps(4) infinite;width:1.2em;overflow:hidden;vertical-align:bottom}
@keyframes blink{0%{width:0}100%{width:1.2em}}
@media (prefers-reduced-motion: reduce){.dots::after{animation:none}}
.composer{position:sticky;bottom:0;background:linear-gradient(to bottom,transparent,var(--bg) 18px);padding-top:18px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.composer-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:8px}
.composer textarea{border:0;resize:none;min-height:52px;max-height:200px;padding:6px 8px;background:transparent;width:100%}
.composer textarea:focus{outline:none}
.composer-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.composer-row .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px;padding:2px 4px 4px}
.opts-hint{font-size:12.5px;color:var(--muted)}
.opts-list{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 10px;font-size:14px;line-height:1.3;cursor:pointer;text-align:left;max-width:100%;overflow-wrap:anywhere}
.opt::before{content:"";width:14px;height:14px;flex:none;border:1.5px solid var(--muted);border-radius:4px}
.opt.one::before{border-radius:50%}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"]::before{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 2px var(--accent-soft)}
.msg.u .txt.has-picked{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.picked{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.picked span{border-radius:999px;background:var(--surface);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);padding:2px 10px;font-size:13.5px}
.msg.u .own{align-self:stretch;text-align:left}
.attach-panel{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.attach-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.attach-actions .btn{min-height:44px}
.attach-hint{font-size:12px;color:var(--muted);flex:1 1 210px}
.attach-list{display:flex;flex-direction:column;gap:6px}
.attachment-chip{display:flex;align-items:center;gap:8px;min-width:0;border:1px solid var(--line);background:var(--sunken);border-radius:9px;padding:5px 8px;font-size:12.5px}
.attachment-chip .attachment-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.attachment-chip .attachment-size{color:var(--muted);font-family:var(--f-mono);font-size:11px;white-space:nowrap}
.attachment-chip a,.attachment-chip button.attachment-open{color:var(--accent);background:transparent;border:0;padding:8px 2px;min-height:40px;cursor:pointer;text-decoration:none;font-weight:600;white-space:nowrap}
.attachment-remove{width:44px;height:44px;border:0;background:transparent;color:var(--danger);cursor:pointer;font-size:20px;line:1;flex:none}
.attach-link-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.attach-link-form .field{flex:1 1 260px}
.attach-link-form .btn{min-height:44px}
.attach-progress{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--accent);font-variant-numeric:tabular-nums}
.attach-progress-track{height:8px;overflow:hidden;border-radius:999px;background:var(--sunken);border:1px solid var(--line)}
.attach-progress-fill{height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .12s linear}
.attach-progress-text{font-family:var(--f-mono);font-size:11.5px;line-height:1.45;overflow-wrap:anywhere}
@media (prefers-reduced-motion: reduce){.attach-progress-fill{transition:none}}
.attachments-admin{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.attachments-admin h3{font-size:14px}
.attachments-admin .attachment-question{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.knowledge-grid{display:grid;gap:16px}
.knowledge-card{display:flex;flex-direction:column;gap:12px;min-width:0}
.knowledge-card h2{font-size:18px;overflow-wrap:anywhere}
.knowledge-card h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:4px 0 6px}
.knowledge-points{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.knowledge-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.knowledge-field{display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line);padding:6px 0;min-width:0}
.knowledge-field span{font-size:13px;color:var(--muted)}
.knowledge-field code{font-size:12px;overflow-wrap:anywhere;color:var(--accent)}
.knowledge-text{white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto;font:12px/1.55 var(--f-mono);background:var(--sunken);padding:12px;border-radius:8px}
.savestate.ok{color:var(--ok)}
.savestate.bad{color:var(--danger)}

/* Summary */
.review{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.review h1,.done-view h1{font:700 clamp(24px,3.6vw,32px)/1.2 var(--f-display)}
.summary{display:flex;flex-direction:column;gap:20px}
.sum-block{display:flex;flex-direction:column;gap:10px}
.sum-block h3{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.count{font-family:var(--f-mono);font-weight:500;color:var(--accent);letter-spacing:0}
.lead-p{font-size:16px;max-width:68ch}
.proc-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.proc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.proc-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.proc h4{font-size:15.5px;font-weight:600;line-height:1.3}
.proc-desc{font-size:14px;color:var(--muted)}
.proc-meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13.5px}
.proc-meta div{display:contents}
.proc-meta dt{color:var(--muted)}
.proc-meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mini-l{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.proc-pains ul,.plain{margin:4px 0 0;padding-left:18px;font-size:14px}
.proc-idea{font-size:13.5px;background:var(--accent-soft);border-radius:8px;padding:7px 10px}
.pot{display:inline-flex;gap:3px;flex:none;margin-top:5px}
.pot i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sunken);border:1px solid var(--line)}
.pot i.on{background:var(--amber);border-color:var(--amber)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.fixbox{padding:16px;display:flex;flex-direction:column;gap:10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.done-view{max-width:640px;margin:8vh auto 0;text-align:left;display:flex;flex-direction:column;gap:14px}
.center-state{max-width:620px;margin:8vh auto 0;display:flex;flex-direction:column;gap:12px}
.center-state h1{font:700 26px/1.2 var(--f-display)}

/* Dashboard */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:10px 14px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .c{font-family:var(--f-mono);font-size:12px;margin-left:6px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.tile .v{font:500 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--muted)}
.tile .k{font-size:12.5px;color:var(--muted);margin-top:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.panel h2{font:700 17px/1.3 var(--f-display);margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.panel h2 .muted{font:400 12.5px var(--f-body)}
.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 34px;gap:10px;align-items:center;font-size:13.5px}
.barrow .l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:8px;border-radius:4px;background:var(--sunken);display:flex;overflow:hidden}
.track i{display:block;height:100%}
.track .d{background:var(--accent)}
.track .p{background:color-mix(in srgb,var(--amber) 55%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.feed{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.feed li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.feed li:first-child{border-top:0}
.feed li:hover .nm{color:var(--accent)}
.feed .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

function csvCell(v) { v = v == null ? '' : String(v); return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function saveFile(filename, data) {
  if (!S.downloads) { toast('Скачивание недоступно в этом окне'); return; }
  S.downloads.save({ filename: filename, data: data }).then(function () { toast('Файл сохранён'); }, function (e) {
    if (e && e.code === 'declined') return;
    toast('Не удалось сохранить файл');
  });
}
function exportCsv() {
  var head = ['Сотрудник', 'Отдел', 'Должность', 'Язык', 'Статус', 'Процесс', 'Описание', 'Частота', 'Часов в неделю', 'Программы', 'Откуда данные', 'Кому результат', 'Что мешает', 'Нужен опыт', 'Потенциал 1-5', 'Что упростить'];
  var lines = [head.map(csvCell).join(';')];
  S.all.forEach(function (x) {
    var base = [personName(x), deptName(x.dept, 'ru'), x.position, x.lang, x.status];
    var ps = x.summary && x.summary.processes && x.summary.processes.length ? x.summary.processes : [null];
    ps.forEach(function (p) {
      var row = base.concat(p ? [p.name, p.description, p.frequency, p.hours_per_week != null ? String(p.hours_per_week).replace('.', ',') : '', p.systems.join(', '), p.inputs_from.join(', '), p.outputs_to.join(', '), p.pain_points.join('; '), p.judgement, p.automation_potential || '', p.automation_idea] : ['', '', '', '', '', '', '', '', '', '', '']);
      lines.push(row.map(csvCell).join(';'));
    });
  });
  saveFile('karta-processov-' + now().slice(0, 10) + '.csv', '﻿' + lines.join('\r\n'));
}
function exportJson() {
  var data = {
    exportedAt: now(),
    interviews: S.all.map(function (x) { var coverage = roleCoverage(x); return { name: personName(x), dept: deptName(x.dept, 'ru'), position: x.position, roleKey: coverage.key, roleKeys: coverage.keys, roleTitle: coverage.title, roleCoverage: coverage, about: x.about || '', aboutAnalysis: x.aboutAnalysis || {}, lang: x.lang, mode: x.mode, status: x.status, startedAt: x.startedAt, submittedAt: x.submittedAt || null, summary: x.summary || null, attachments: x.attachments || [], messages: (x.messages || []).map(function (m) { return { role: m.role, content: m.content, t: m.t, questionKey: m.questionKey || null, attachmentIds: m.attachmentIds || [] }; }) }; }),
    analysis: S.analysis || null
  };
  saveFile('karta-processov-' + now().slice(0, 10) + '.json', JSON.stringify(data, null, 2));
}

/* ---------- запуск ---------- */
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && S.selected) { S.selected = null; S.confirmDel = false; render(); } });

var cols = { interviews: [], guests: [] };
function subscribeAll() {
  ['interviews', 'guests'].forEach(function (col) { subscribeCol(col); });
}
function subscribeCol(col) {
  S.db.collection(col).onSnapshot(function (snap) {
    cols[col] = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; o._col = col; return o; });
    S.all = cols.interviews.concat(cols.guests);
    S.dashErr = '';
    var ids = cols.interviews.map(function (x) { return x.id; });
    if (S.user && ids.length) S.user.profiles(ids).then(function (ps) { S.profiles = ps || {}; if (S.ownerMode === 'dash') render(); });
    if (S.ownerMode === 'dash') render();
  }, function (e) {
    S.dashErr = 'Связь с хранилищем прервалась (' + (e && e.code) + '). Обновите страницу.';
    if (S.ownerMode === 'dash') render();
  });
}

function boot() {
  render();
  if (!window.claude || typeof window.claude.use !== 'function') { S.offline = true; S.ready = true; render(); return; }
  var use = function (n) { return window.claude.use(n).catch(function () { return null; }); };
  Promise.all([use('db'), use('user'), use('sample'), use('downloads')]).then(function (r) {
    S.db = r[0]; S.user = r[1]; S.sample = r[2]; S.downloads = r[3];
    var u = S.user;
    var info = u ? Promise.all([u.id(), u.isOwner(), u.me(), typeof u.can === 'function' ? u.can('data.write') : null]) : Promise.resolve([null, false, { name: '' }, null]);
    return info.then(function (v) {
      S.uid = v[0]; S.isOwner = !!v[1]; S.meName = (v[2] && v[2].name) || ''; S.readOnly = v[3] === false;
      if (S.db && !S.uid && !S.readOnly) {
        var rid = null;
        try { rid = localStorage.getItem('bp_guest_id'); } catch (e) {}
        if (!rid) { rid = 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); try { localStorage.setItem('bp_guest_id', rid); } catch (e) {} }
        S.uid = rid; S.guest = true;
      }
      if (!S.db || !S.uid) return;
      S.myRef = S.db.doc((S.guest ? 'guests/' : 'interviews/') + S.uid);
      var mine = S.myRef.get().then(function (snap) {
        if (snap && snap.exists) {
          S.iv = clone(snap.data());
          if (S.iv.lang === 'ru' || S.iv.lang === 'ro') S.lang = S.iv.lang;
          if (!S.iv.script) S.iv.script = { stage: 'p1', i: 0, task: 1 };
          S.view = S.iv.status === 'done' ? 'done' : S.iv.status === 'review' ? 'review' : 'chat';
          if (S.iv.mode === 'ai' && !S.sample) { S.iv.mode = 'script'; S.notice = t('scriptNotice'); }
        }
      }, function () {});
      var an = S.isOwner ? S.db.doc('analysis/latest').get().then(function (s) { if (s && s.exists) S.analysis = clone(s.data()); }, function () {}) : null;
      return Promise.all([mine, an]).then(function () { if (S.isOwner) subscribeAll(); });
    });
  }).catch(function () {}).then(function () {
    S.ready = true;
    render();
    resumeIfNeeded();
  });
}
function resumeIfNeeded() {
  if (S.view !== 'chat' || !S.iv || S.busy || S.reopened) return;
  if (S.isOwner && S.ownerMode !== 'self') return;
  var last = S.iv.messages && S.iv.messages[S.iv.messages.length - 1];
  if (last && last.role !== 'user') { if (S.voiceOn) scheduleMessageSpeech(last); return; }
  if (S.iv.mode === 'ai') aiTurn(); else scriptAsk();
}
boot();
})();
</script>
