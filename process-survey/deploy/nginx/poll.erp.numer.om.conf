# nginx хоста: опрос «Карта процессов Balkan» на poll.erp.numer.om → контейнер 127.0.0.1:18795.
# Ставится в /etc/nginx/sites-available/poll.erp.numer.om.conf + симлинк в sites-enabled.
# Первый выпуск сертификата — poll.erp.numer.om.http-only.conf (см. ../README.md).
# Заголовки безопасности (CSP с frame-ancestors github.io, nosniff, Referrer-Policy) ставит сам server.py.

server {
    listen 80;
    listen [::]:80;
    server_name poll.erp.numer.om;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://poll.erp.numer.om$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name poll.erp.numer.om;

    ssl_certificate     /etc/letsencrypt/live/poll.erp.numer.om/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poll.erp.numer.om/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BALKANOPROS_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Вложения грузятся частями по 8 МиБ (UPLOAD_CHUNK), JSON-тела ≤ 600 КБ (MAX_BODY) — запас ×2.
    client_max_body_size 16m;
    client_body_buffer_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # nginx — публичная граница: server.py берёт IP клиента из CF-Connecting-IP / X-Forwarded-For
    # (лимиты частоты, блокировка подбора пароля) — клиентские значения отбрасываем, ставим свои.
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location / {
        proxy_pass http://127.0.0.1:18795;
        # Ход интервью/резюме/анализ ждут модель синхронно (таймауты в server.py до 300 с).
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_request_buffering off;
    }
}
