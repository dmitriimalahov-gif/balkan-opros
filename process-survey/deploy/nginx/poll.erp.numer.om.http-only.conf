# Временный конфиг ТОЛЬКО для первого выпуска сертификата (ACME webroot). После certbot заменить на
# poll.erp.numer.om.conf — домен не оставлять без 443.
server {
    listen 80;
    listen [::]:80;
    server_name poll.erp.numer.om;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
